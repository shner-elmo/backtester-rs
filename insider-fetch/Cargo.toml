[package]
name = "insider-fetch"
version = "0.1.0"
edition = "2021"
description = "Download SEC EDGAR Form 4 insider transactions into insider_transactions.json"

[dependencies]
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
