<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>data-viz</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0d1117; color: #c9d1d9; font: 13px/1.4 "SF Mono", "Consolas", monospace; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  #toolbar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 10px;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  #toolbar input[type=text] {
    width: 80px; padding: 4px 6px;
    background: #0d1117; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 4px;
    text-transform: uppercase;
  }
  #toolbar input[type=date] {
    width: 132px; padding: 4px 6px;
    background: #0d1117; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 4px;
  }
  .tf-group { display: flex; gap: 2px; }
  .tf-btn {
    padding: 4px 7px; background: #0d1117; color: #8b949e;
    border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .tf-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .tf-btn:hover:not(.active) { background: #21262d; }
  button {
    padding: 4px 10px; border: 1px solid #30363d; border-radius: 4px;
    cursor: pointer; font-size: 12px; font-family: inherit;
  }
  #load-btn  { background: #238636; color: #fff; border-color: #238636; }
  #load-btn:disabled { opacity: .5; cursor: default; }
  #load-btn:hover:not(:disabled) { background: #2ea043; }
  #cancel-btn { background: #b62324; color: #fff; border-color: #b62324; display: none; }
  #cancel-btn:hover { background: #da3633; }
  .nav-btn { padding: 4px 7px; background: #0d1117; color: #8b949e; }
  .nav-btn:hover { background: #21262d; }
  #status { font-size: 11px; color: #8b949e; margin-left: 4px; }
  .sep { width: 1px; height: 20px; background: #30363d; margin: 0 2px; }

  #indicators-row {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  #add-ind-btn { background: #0d1117; color: #8b949e; font-size: 12px; }
  #add-ind-btn:hover { background: #21262d; }
  .ind-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px; border-radius: 4px;
    background: #21262d; border: 1px solid #30363d;
  }
  .ind-chip select, .ind-chip input {
    background: #0d1117; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 3px;
    padding: 2px 4px; font-size: 12px; font-family: inherit;
  }
  .ind-chip select { cursor: pointer; }
  .ind-chip input { width: 44px; }
  .ind-chip .rm { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .ind-chip .rm:hover { color: #f85149; }

  #charts { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
  #main-chart { flex: 1 1 auto; }
  #osc-chart { flex: 0 0 140px; border-top: 1px solid #30363d; display: none; }

  #statusbar {
    flex: 0 0 auto;
    padding: 3px 10px; font-size: 11px; color: #6e7681;
    background: #161b22; border-top: 1px solid #30363d;
  }
</style>
</head>
<body>

<div id="toolbar">
  <input id="symbol" type="text" value="AAPL" placeholder="Symbol">
  <div class="sep"></div>
  <div class="tf-group" id="tf-group"></div>
  <div class="sep"></div>
  <button class="nav-btn" onclick="shiftDate('start',-1)">&#9664;</button>
  <input id="start" type="date" value="2021-01-01">
  <button class="nav-btn" onclick="shiftDate('start', 1)">&#9654;</button>
  <div class="sep"></div>
  <button class="nav-btn" onclick="shiftDate('end',-1)">&#9664;</button>
  <input id="end" type="date">
  <button class="nav-btn" onclick="shiftDate('end', 1)">&#9654;</button>
  <div class="sep"></div>
  <button id="load-btn" onclick="load()">Load</button>
  <button id="cancel-btn" onclick="cancel()">Cancel</button>
  <span id="status"></span>
</div>

<div id="indicators-row">
  <button id="add-ind-btn" onclick="addIndicator()">+ Add Indicator</button>
</div>

<div id="charts">
  <div id="main-chart"></div>
  <div id="osc-chart"></div>
</div>

<div id="statusbar">Ready</div>

<script>
'use strict';

// ── Default end date: start + 1 month ──
(function () {
  const d = new Date('2021-01-01T00:00:00');
  d.setMonth(d.getMonth() + 1);
  document.getElementById('end').value = d.toISOString().slice(0, 10);
})();

// ── Timeframe buttons ──
const TIMEFRAMES = [
  { key: 'minute', label: '1m' },
  { key: 'min5',   label: '5m' },
  { key: 'min15',  label: '15m' },
  { key: 'hour1',  label: '1h' },
  { key: 'hour4',  label: '4h' },
  { key: 'daily',  label: '1D' },
];
let currentTf = 'minute';
(function () {
  const g = document.getElementById('tf-group');
  for (const { key, label } of TIMEFRAMES) {
    const btn = document.createElement('button');
    btn.className = 'tf-btn' + (key === currentTf ? ' active' : '');
    btn.textContent = label;
    btn.dataset.tf = key;
    btn.onclick = () => {
      currentTf = key;
      document.querySelectorAll('.tf-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tf === key)
      );
      pendingKey = null;  // timeframe changed, allow reload
    };
    g.appendChild(btn);
  }
})();

function shiftDate(id, delta) {
  const el = document.getElementById(id);
  const d = new Date((el.value || '2021-01-01') + 'T00:00:00');
  d.setDate(1);
  d.setMonth(d.getMonth() + delta);
  el.value = d.toISOString().slice(0, 10);
  pendingKey = null;  // date changed, allow reload
}

// ── Charts ──
const LC = LightweightCharts;
const chartOpts = {
  layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
  grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
  crosshair: { mode: LC.CrosshairMode.Normal },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#30363d' },
  rightPriceScale: { borderColor: '#30363d' },
};
const mainEl  = document.getElementById('main-chart');
const oscEl   = document.getElementById('osc-chart');
const mainChart = LC.createChart(mainEl, { ...chartOpts, width: mainEl.clientWidth, height: mainEl.clientHeight });
const oscChart  = LC.createChart(oscEl,  { ...chartOpts, width: oscEl.clientWidth,  height: 140 });

// Sync time scales
mainChart.timeScale().subscribeVisibleTimeRangeChange(range => {
  if (range) oscChart.timeScale().setVisibleRange(range);
});

new ResizeObserver(() => {
  mainChart.applyOptions({ width: mainEl.clientWidth, height: mainEl.clientHeight });
}).observe(mainEl);
new ResizeObserver(() => {
  oscChart.applyOptions({ width: oscEl.clientWidth });
}).observe(oscEl);

// ── Series state ──
let regSeries    = null;
let extSeries    = null;
let regVolSeries = null;
let extVolSeries = null;
const overlaySeries = {};
const oscSeries     = {};

function clearSeriesAndInit() {
  for (const s of Object.values(overlaySeries)) mainChart.removeSeries(s);
  Object.keys(overlaySeries).forEach(k => delete overlaySeries[k]);
  for (const s of Object.values(oscSeries)) oscChart.removeSeries(s);
  Object.keys(oscSeries).forEach(k => delete oscSeries[k]);

  if (regSeries)    mainChart.removeSeries(regSeries);
  if (extSeries)    mainChart.removeSeries(extSeries);
  if (regVolSeries) mainChart.removeSeries(regVolSeries);
  if (extVolSeries) mainChart.removeSeries(extVolSeries);

  regVolSeries = mainChart.addHistogramSeries({
    color: '#264c35', priceFormat: { type: 'volume' },
    priceScaleId: 'vol', scaleMargins: { top: 0.85, bottom: 0 },
  });
  extVolSeries = mainChart.addHistogramSeries({
    color: '#1e2c3a', priceFormat: { type: 'volume' },
    priceScaleId: 'vol', scaleMargins: { top: 0.85, bottom: 0 },
  });
  regSeries = mainChart.addCandlestickSeries({
    upColor: '#3fb950', downColor: '#f85149',
    borderUpColor: '#3fb950', borderDownColor: '#f85149',
    wickUpColor: '#3fb950', wickDownColor: '#f85149',
    priceScaleId: 'right', scaleMargins: { top: 0, bottom: 0.15 },
  });
  extSeries = mainChart.addCandlestickSeries({
    upColor: '#2a3d2a', downColor: '#3d1f1f',
    borderUpColor: '#2a3d2a', borderDownColor: '#3d1f1f',
    wickUpColor: '#3d3d3d', wickDownColor: '#3d3d3d',
    priceScaleId: 'right', scaleMargins: { top: 0, bottom: 0.15 },
  });
}

// ── Bar and indicator accumulation ──
let allRegBars = [];
let allExtBars = [];
let indAccum   = {};
let rafPending = false;

function scheduleChartUpdate() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    applyBarsToChart();
  });
}

function applyBarsToChart() {
  regSeries.setData(allRegBars);
  extSeries.setData(allExtBars);
  regVolSeries.setData(allRegBars.map(b => ({
    time: b.time, value: b.volume,
    color: b.close >= b.open ? '#264c35' : '#3d2020',
  })));
  extVolSeries.setData(allExtBars.map(b => ({
    time: b.time, value: b.volume, color: '#1e2c3a',
  })));
}

function applyIndicatorsFromAccum() {
  for (const ind of indicators) {
    const spec = indSpec(ind);
    const type = ind.type;

    if (type === 'ema' || type === 'sma') {
      const pts = indAccum[type];
      if (!pts || pts.length === 0) continue;
      if (!overlaySeries[spec]) {
        overlaySeries[spec] = mainChart.addLineSeries({
          color: type === 'ema' ? '#f0a500' : '#5d87cc',
          lineWidth: 1, priceScaleId: 'right',
        });
      }
      overlaySeries[spec].setData(pts);

    } else if (type === 'bbands') {
      for (const [key, color] of [['upper','#c678dd'],['middle','#e5c07b'],['lower','#c678dd']]) {
        const pts = indAccum[key];
        if (!pts || pts.length === 0) continue;
        const k = spec + '_' + key;
        if (!overlaySeries[k]) {
          overlaySeries[k] = mainChart.addLineSeries({ color, lineWidth: 1, priceScaleId: 'right' });
        }
        overlaySeries[k].setData(pts);
      }

    } else if (type === 'rsi') {
      const pts = indAccum['rsi'];
      if (!pts || pts.length === 0) continue;
      if (!oscSeries[spec]) {
        oscSeries[spec] = oscChart.addLineSeries({ color: '#61afef', lineWidth: 1 });
      }
      oscSeries[spec].setData(pts);
      oscEl.style.display = 'block';
      oscChart.applyOptions({ width: oscEl.clientWidth, height: 140 });

    } else if (type === 'macd') {
      const macdPts = indAccum['macd'];
      const sigPts  = indAccum['signal'];
      const histPts = indAccum['histogram'];
      if (!macdPts || macdPts.length === 0) continue;
      if (!oscSeries[spec + '_macd']) {
        oscSeries[spec + '_macd']   = oscChart.addLineSeries({ color: '#61afef', lineWidth: 1 });
        oscSeries[spec + '_signal'] = oscChart.addLineSeries({ color: '#e06c75', lineWidth: 1 });
        oscSeries[spec + '_hist']   = oscChart.addHistogramSeries({ color: '#264c35' });
      }
      oscSeries[spec + '_macd'].setData(macdPts);
      if (sigPts)  oscSeries[spec + '_signal'].setData(sigPts);
      if (histPts) oscSeries[spec + '_hist'].setData(
        histPts.map(p => ({ ...p, color: p.value >= 0 ? '#264c35' : '#3d2020' }))
      );
      oscEl.style.display = 'block';
      oscChart.applyOptions({ width: oscEl.clientWidth, height: 140 });
    }
  }
}

// ── Request lifecycle ──
let activeSrc  = null;
let pendingKey = null;

function buildQueryKey() {
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  const start  = document.getElementById('start').value;
  const end    = document.getElementById('end').value;
  const inds   = indicators.map(indSpec).join(',');
  return `${symbol}|${currentTf}|${start}|${end}|${inds}`;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setSB(msg)     { document.getElementById('statusbar').textContent = msg; }

function cancel() {
  if (activeSrc) { activeSrc.close(); activeSrc = null; }
  pendingKey = null;
  document.getElementById('load-btn').disabled = false;
  document.getElementById('cancel-btn').style.display = 'none';
  setStatus('Cancelled');
  setSB('Cancelled');
}

function load() {
  const key = buildQueryKey();

  // Dedup: same request already in-flight → do nothing
  if (activeSrc !== null && key === pendingKey) return;

  // Supersede any previous in-flight request
  if (activeSrc !== null) { activeSrc.close(); activeSrc = null; }
  pendingKey = key;

  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  const start  = document.getElementById('start').value;
  const end    = document.getElementById('end').value;
  if (!symbol) { setStatus('Enter a symbol'); return; }

  // Reset
  allRegBars = []; allExtBars = [];
  indAccum   = {};
  oscEl.style.display = 'none';
  clearSeriesAndInit();

  const q = new URLSearchParams({ symbol, start, end, timeframe: currentTf });
  for (const ind of indicators) q.append('ind', indSpec(ind));

  document.getElementById('load-btn').disabled = true;
  document.getElementById('cancel-btn').style.display = '';
  setStatus('Sent!');
  setSB('Connecting…');

  const src = new EventSource('/api/stream/bars?' + q.toString());
  activeSrc = src;

  src.addEventListener('bars', e => {
    if (activeSrc !== src) return;
    const payload = JSON.parse(e.data);
    const batch = payload.bars || [];

    for (const b of batch) {
      (b.is_extended ? allExtBars : allRegBars).push(b);
    }
    for (const [key, pts] of Object.entries(payload)) {
      if (key === 'bars' || !Array.isArray(pts)) continue;
      if (!indAccum[key]) indAccum[key] = [];
      for (const p of pts) indAccum[key].push(p);
    }

    const n = allRegBars.length + allExtBars.length;
    setStatus('Loading… ' + n.toLocaleString() + ' bars');
    setSB('Streaming — ' + n.toLocaleString() + ' bars received');
    scheduleChartUpdate();
  });

  src.addEventListener('done', () => {
    if (activeSrc !== src) return;
    src.close(); activeSrc = null;

    applyBarsToChart();
    mainChart.timeScale().fitContent();
    applyIndicatorsFromAccum();

    const total = allRegBars.length + allExtBars.length;
    const msg = total === 0 ? 'No data for this range'
                             : 'Done — ' + total.toLocaleString() + ' bars';
    setStatus(msg); setSB(msg);
    document.getElementById('load-btn').disabled = false;
    document.getElementById('cancel-btn').style.display = 'none';
    // Keep pendingKey set so the same params don't re-fire until something changes
  });

  src.addEventListener('error', e => {
    if (activeSrc !== src) return;
    let msg = 'Server error';
    try { const d = JSON.parse(e.data); msg = d.message || msg; } catch (_) {}
    setStatus('Error: ' + msg);
    setSB('Error: ' + msg);
    src.close(); activeSrc = null; pendingKey = null;
    document.getElementById('load-btn').disabled = false;
    document.getElementById('cancel-btn').style.display = 'none';
  });

  src.onerror = () => {
    if (activeSrc !== src) return;
    src.close(); activeSrc = null; pendingKey = null;
    setStatus('Connection lost');
    document.getElementById('load-btn').disabled = false;
    document.getElementById('cancel-btn').style.display = 'none';
  };
}

// Enter key in inputs triggers load
['symbol','start','end'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') load();
  });
});

// Symbol input clears pendingKey when value changes
document.getElementById('symbol').addEventListener('input', () => { pendingKey = null; });
document.getElementById('start').addEventListener('change', () => { pendingKey = null; });
document.getElementById('end').addEventListener('change',   () => { pendingKey = null; });

// ── Multi-indicator chip UI ──
let indicators = [];
let nextIndId  = 0;

const IND_PARAMS = {
  ema:    [{ name: 'period', label: 'Period', def: 20, step: 1 }],
  sma:    [{ name: 'period', label: 'Period', def: 20, step: 1 }],
  rsi:    [{ name: 'period', label: 'Period', def: 14, step: 1 }],
  macd:   [
    { name: 'fast',   label: 'Fast',   def: 12, step: 1 },
    { name: 'slow',   label: 'Slow',   def: 26, step: 1 },
    { name: 'signal', label: 'Sig',    def:  9, step: 1 },
  ],
  bbands: [
    { name: 'period', label: 'Period', def: 20,  step: 1   },
    { name: 'mult',   label: 'σ', def: 2.0, step: 0.1 },
  ],
};

function indSpec(ind) {
  const ps = IND_PARAMS[ind.type] || [];
  const vals = ps.map(p => ind[p.name] !== undefined ? ind[p.name] : p.def);
  return [ind.type, ...vals].join(':');
}

function renderChips() {
  const row = document.getElementById('indicators-row');
  [...row.querySelectorAll('.ind-chip')].forEach(c => c.remove());

  for (const ind of indicators) {
    const chip = document.createElement('div');
    chip.className = 'ind-chip';

    const sel = document.createElement('select');
    for (const t of Object.keys(IND_PARAMS)) {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = t.toUpperCase();
      if (t === ind.type) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = () => {
      ind.type = sel.value;
      for (const p of (IND_PARAMS[ind.type] || [])) ind[p.name] = p.def;
      pendingKey = null;
      renderChips();
    };
    chip.appendChild(sel);

    for (const p of (IND_PARAMS[ind.type] || [])) {
      const lbl = document.createElement('span');
      lbl.textContent = p.label + ':';
      lbl.style.color = '#6e7681';
      chip.appendChild(lbl);

      const inp = document.createElement('input');
      inp.type = 'number';
      inp.value = ind[p.name] !== undefined ? ind[p.name] : p.def;
      inp.min = 1; inp.step = p.step;
      inp.onchange = () => {
        ind[p.name] = parseFloat(inp.value) || p.def;
        pendingKey = null;
      };
      chip.appendChild(inp);
    }

    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.onclick = () => {
      indicators = indicators.filter(i => i.id !== ind.id);
      pendingKey = null;
      renderChips();
    };
    chip.appendChild(rm);
    row.appendChild(chip);
  }
}

function addIndicator() {
  indicators.push({ id: nextIndId++, type: 'ema', period: 20 });
  pendingKey = null;
  renderChips();
}

renderChips();
</script>
</body>
</html>
