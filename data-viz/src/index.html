<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>data-viz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .controls { padding: 8px 14px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .ctrl-group { display: flex; align-items: center; gap: 4px; }
    label { color: #8b949e; font-size: 12px; white-space: nowrap; }
    input[type="text"], input[type="date"], input[type="number"] {
      background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
      padding: 4px 7px; border-radius: 6px; font-size: 12px; font-family: inherit;
    }
    input[type="date"] { color-scheme: dark; }
    input:focus { outline: none; border-color: #58a6ff; }
    button.icon-btn {
      background: #21262d; color: #8b949e; border: 1px solid #30363d;
      padding: 4px 7px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; line-height: 1;
    }
    button.icon-btn:hover { background: #30363d; color: #c9d1d9; }

    .tf-btns { display: flex; gap: 3px; }
    .tf-btn {
      background: #21262d; color: #8b949e; border: 1px solid #30363d;
      padding: 4px 9px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .tf-btn:hover { background: #30363d; color: #c9d1d9; }
    .tf-btn.active { background: #1f3a5f; color: #58a6ff; border-color: #388bfd; }

    .load-btn {
      background: #238636; color: #fff; border: none;
      padding: 5px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .load-btn:hover { background: #2ea043; }
    .load-btn:disabled { background: #1b4d28; color: #8b949e; cursor: not-allowed; }
    .load-status { font-size: 12px; min-width: 140px; }
    .load-status.sent    { color: #f0883e; }
    .load-status.loading { color: #58a6ff; }
    .load-status.done    { color: #3fb950; }
    .load-status.err     { color: #f85149; }

    .ind-row { padding: 5px 14px; background: #0d1117; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 34px; }
    .add-ind-btn {
      background: #21262d; color: #8b949e; border: 1px solid #30363d;
      padding: 3px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .add-ind-btn:hover { background: #30363d; color: #c9d1d9; }
    .ind-chip {
      display: flex; align-items: center; gap: 5px;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 2px 8px; font-size: 12px;
    }
    .ind-chip select, .ind-chip input[type="number"] {
      background: transparent; border: none; color: #c9d1d9; font-size: 12px;
      font-family: inherit; outline: none; padding: 0;
    }
    .ind-chip select { color: #a371f7; cursor: pointer; }
    .ind-chip .plbl { color: #8b949e; }
    .ind-chip .rm { background: none; border: none; color: #6e7681; cursor: pointer; font-size: 13px; padding: 0 2px; }
    .ind-chip .rm:hover { color: #f85149; }

    .charts { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    #chart-main { flex: 1; min-height: 0; }
    .osc-pane { height: 160px; border-top: 1px solid #30363d; display: none; position: relative; }
    .osc-pane.on { display: block; }
    .osc-lbl { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #6e7681; z-index: 10; pointer-events: none; }

    .statusbar { padding: 3px 14px; font-size: 11px; color: #6e7681; background: #161b22; border-top: 1px solid #30363d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="ctrl-group">
      <label>Symbol&nbsp;</label>
      <input id="symbol" type="text" value="AAPL" style="width:65px">
    </div>

    <div class="ctrl-group">
      <label>TF&nbsp;</label>
      <div class="tf-btns">
        <button class="tf-btn active" data-tf="minute" onclick="setTf(this)">1m</button>
        <button class="tf-btn" data-tf="min5"   onclick="setTf(this)">5m</button>
        <button class="tf-btn" data-tf="min15"  onclick="setTf(this)">15m</button>
        <button class="tf-btn" data-tf="hour1"  onclick="setTf(this)">1h</button>
        <button class="tf-btn" data-tf="hour4"  onclick="setTf(this)">4h</button>
        <button class="tf-btn" data-tf="daily"  onclick="setTf(this)">1D</button>
      </div>
    </div>

    <div class="ctrl-group">
      <button class="icon-btn" onclick="shiftDate('start',-1)" title="Prev month">&#9664;</button>
      <label>&nbsp;Start&nbsp;</label>
      <input id="start" type="date" value="2021-01-01">
      <button class="icon-btn" onclick="shiftDate('start',+1)" title="Next month">&#9654;</button>
    </div>

    <div class="ctrl-group">
      <button class="icon-btn" onclick="shiftDate('end',-1)" title="Prev month">&#9664;</button>
      <label>&nbsp;End&nbsp;</label>
      <input id="end" type="date">
      <button class="icon-btn" onclick="shiftDate('end',+1)" title="Next month">&#9654;</button>
    </div>

    <button class="load-btn" id="load-btn" onclick="load()">Load</button>
    <span class="load-status" id="load-status"></span>
  </div>

  <div class="ind-row">
    <button class="add-ind-btn" onclick="addIndicator()">+ Indicator</button>
    <div id="ind-chips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>

  <div class="charts">
    <div id="chart-main"></div>
    <div id="chart-osc" class="osc-pane">
      <span class="osc-lbl" id="osc-lbl"></span>
    </div>
  </div>

  <div class="statusbar" id="statusbar">Ready</div>

  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const THEME = {
      layout:  { background: { color: '#0d1117' }, textColor: '#8b949e' },
      grid:    { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
      crosshair: { mode: 1 },
      rightPriceScale: { borderColor: '#30363d' },
      timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false },
    };

    // ── State ────────────────────────────────────────────────────────────────
    let currentTf   = 'minute';
    let activeSrc   = null;
    let indicators  = [];
    let nextIndId   = 0;
    let allRegBars  = [];
    let allExtBars  = [];
    let overlaySeries = [];
    let oscChart    = null;

    // ── Charts ───────────────────────────────────────────────────────────────
    const mainChart = LightweightCharts.createChart(
      document.getElementById('chart-main'), { ...THEME, autoSize: true }
    );
    const regSeries = mainChart.addCandlestickSeries({
      upColor: '#3fb950', downColor: '#f85149',
      borderUpColor: '#3fb950', borderDownColor: '#f85149',
      wickUpColor: '#3fb950', wickDownColor: '#f85149',
    });
    const extSeries = mainChart.addCandlestickSeries({
      upColor: '#2a3d2a', downColor: '#3d1f1f',
      borderUpColor: '#2a3d2a', borderDownColor: '#3d1f1f',
      wickUpColor: '#2a3d2a', wickDownColor: '#3d1f1f',
    });
    const regVolSeries = mainChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
    const extVolSeries = mainChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
    mainChart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

    // Default end = today
    document.getElementById('end').value = new Date().toISOString().slice(0, 10);

    // ── Timeframe ────────────────────────────────────────────────────────────
    function setTf(btn) {
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTf = btn.dataset.tf;
    }

    // ── Date ± month ─────────────────────────────────────────────────────────
    function shiftDate(id, delta) {
      const el = document.getElementById(id);
      const d  = new Date(el.value || new Date().toISOString().slice(0, 10));
      d.setDate(1); // pin to first of month to avoid day overflow
      d.setMonth(d.getMonth() + delta);
      el.value = d.toISOString().slice(0, 10);
    }

    // ── Status ───────────────────────────────────────────────────────────────
    function setLS(msg, cls) {
      const el = document.getElementById('load-status');
      el.textContent = msg;
      el.className = 'load-status' + (cls ? ' ' + cls : '');
    }
    function setSB(msg) { document.getElementById('statusbar').textContent = msg; }

    // ── Clear ────────────────────────────────────────────────────────────────
    function clearChart() {
      regSeries.setData([]); extSeries.setData([]);
      regVolSeries.setData([]); extVolSeries.setData([]);
      overlaySeries.forEach(s => mainChart.removeSeries(s));
      overlaySeries = [];
      if (oscChart) { oscChart.remove(); oscChart = null; }
      document.getElementById('chart-osc').classList.remove('on');
      document.getElementById('osc-lbl').textContent = '';
      allRegBars = []; allExtBars = [];
    }

    function applyBarsToChart() {
      const toC  = b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close });
      const toV  = (b, up, dn) => ({ time: b.time, value: b.volume, color: b.close >= b.open ? up : dn });

      regSeries.setData(allRegBars.map(toC));
      regVolSeries.setData(allRegBars.map(b => toV(b, '#3fb95033', '#f8514933')));

      if (currentTf !== 'daily') {
        extSeries.setData(allExtBars.map(toC));
        extVolSeries.setData(allExtBars.map(b => toV(b, '#2a3d2a44', '#3d1f1f44')));
      } else {
        extSeries.setData([]); extVolSeries.setData([]);
      }
    }

    // ── Load ─────────────────────────────────────────────────────────────────
    function load() {
      const symbol = document.getElementById('symbol').value.trim().toUpperCase();
      const start  = document.getElementById('start').value;
      const end    = document.getElementById('end').value;
      if (!symbol) { setLS('Enter a symbol.', 'err'); return; }

      if (activeSrc) { activeSrc.close(); activeSrc = null; }
      clearChart();
      setLS('Sent!', 'sent');
      document.getElementById('load-btn').disabled = true;

      let q = `symbol=${encodeURIComponent(symbol)}&timeframe=${currentTf}`;
      if (start) q += `&start=${start}`;
      if (end)   q += `&end=${end}`;

      const src = new EventSource(`/api/stream/bars?${q}`);
      activeSrc = src;

      src.addEventListener('bars', e => {
        const batch = JSON.parse(e.data);
        for (const b of batch) {
          (b.is_extended ? allExtBars : allRegBars).push(b);
        }
        const n = allRegBars.length + allExtBars.length;
        setLS(`Loading… ${n.toLocaleString()} bars`, 'loading');
        setSB(`Streaming — ${n.toLocaleString()} bars received`);
      });

      src.addEventListener('done', async () => {
        src.close(); activeSrc = null;
        applyBarsToChart();
        mainChart.timeScale().fitContent();

        const total = allRegBars.length + allExtBars.length;
        if (total === 0) {
          setLS('No data', 'err');
          setSB(`No data for ${symbol}`);
        } else {
          setLS(`Done — ${total.toLocaleString()} bars`, 'done');
          setSB(`${symbol} · ${currentTf} · ${total.toLocaleString()} bars`);
          if (indicators.length > 0) await fetchAllIndicators(symbol, start, end);
        }
        document.getElementById('load-btn').disabled = false;
      });

      src.addEventListener('error', e => {
        // Application-level error event from server
        if (e.data) {
          try { const d = JSON.parse(e.data); setSB(`Error: ${d.message}`); } catch(_) {}
        }
        if (src.readyState === EventSource.CLOSED || src.readyState === EventSource.CONNECTING) {
          setLS('Error', 'err');
          src.close(); activeSrc = null;
          document.getElementById('load-btn').disabled = false;
        }
      });
    }

    // ── Indicators ───────────────────────────────────────────────────────────
    const OSC_KEYS = new Set(['macd', 'signal', 'histogram', 'rsi']);
    const COLORS   = {
      ema: '#58a6ff', sma: '#f0883e',
      upper: '#3fb950', middle: '#a371f7', lower: '#3fb950',
      macd: '#58a6ff', signal: '#f0883e', histogram: '#888',
      rsi: '#f85149',
    };

    function defaultParams(type) {
      if (type === 'ema' || type === 'sma')  return { period: 20 };
      if (type === 'rsi')                    return { period: 14 };
      if (type === 'macd')                   return { fast: 12, slow: 26, signal: 9 };
      if (type === 'bbands')                 return { period: 20, mult: 2.0 };
      return {};
    }

    function addIndicator() {
      const id = nextIndId++;
      indicators.push({ id, type: 'ema', params: { period: 20 } });
      renderChips();
    }

    function removeIndicator(id) {
      indicators = indicators.filter(i => i.id !== id);
      renderChips();
      refreshIndicators();
    }

    function updateIndType(id, type) {
      const ind = indicators.find(i => i.id === id);
      if (!ind) return;
      ind.type = type; ind.params = defaultParams(type);
      renderChips();
    }

    function updateParam(id, key, val) {
      const ind = indicators.find(i => i.id === id);
      if (ind) ind.params[key] = Number(val);
    }

    function paramsHtml(ind) {
      const p = ind.params;
      const n = ind.id;
      if (ind.type === 'ema' || ind.type === 'sma')
        return `<span class="plbl"> per=</span><input type="number" min="1" value="${p.period}" style="width:38px" onchange="updateParam(${n},'period',this.value)">`;
      if (ind.type === 'rsi')
        return `<span class="plbl"> per=</span><input type="number" min="1" value="${p.period}" style="width:38px" onchange="updateParam(${n},'period',this.value)">`;
      if (ind.type === 'macd')
        return `<span class="plbl"> f=</span><input type="number" min="1" value="${p.fast}" style="width:30px" onchange="updateParam(${n},'fast',this.value)">` +
               `<span class="plbl"> s=</span><input type="number" min="1" value="${p.slow}" style="width:30px" onchange="updateParam(${n},'slow',this.value)">` +
               `<span class="plbl"> sig=</span><input type="number" min="1" value="${p.signal}" style="width:30px" onchange="updateParam(${n},'signal',this.value)">`;
      if (ind.type === 'bbands')
        return `<span class="plbl"> per=</span><input type="number" min="1" value="${p.period}" style="width:38px" onchange="updateParam(${n},'period',this.value)">` +
               `<span class="plbl"> σ=</span><input type="number" min="0.1" step="0.1" value="${p.mult}" style="width:38px" onchange="updateParam(${n},'mult',this.value)">`;
      return '';
    }

    function renderChips() {
      document.getElementById('ind-chips').innerHTML = indicators.map(ind => `
        <div class="ind-chip">
          <select onchange="updateIndType(${ind.id},this.value)">
            <option value="ema"    ${ind.type==='ema'?'selected':''}>EMA</option>
            <option value="sma"    ${ind.type==='sma'?'selected':''}>SMA</option>
            <option value="rsi"    ${ind.type==='rsi'?'selected':''}>RSI</option>
            <option value="macd"   ${ind.type==='macd'?'selected':''}>MACD</option>
            <option value="bbands" ${ind.type==='bbands'?'selected':''}>BBands</option>
          </select>
          ${paramsHtml(ind)}
          <button class="rm" onclick="removeIndicator(${ind.id})" title="Remove">&#x2715;</button>
        </div>
      `).join('');
    }

    async function fetchAllIndicators(symbol, start, end) {
      overlaySeries.forEach(s => mainChart.removeSeries(s));
      overlaySeries = [];
      if (oscChart) { oscChart.remove(); oscChart = null; }
      document.getElementById('chart-osc').classList.remove('on');
      document.getElementById('osc-lbl').textContent = '';

      const oscLabels = [];
      for (const ind of indicators) {
        const p = ind.params;
        let url = `/api/indicators?symbol=${encodeURIComponent(symbol)}&type=${ind.type}&timeframe=${currentTf}`;
        if (start)    url += `&start=${start}`;
        if (end)      url += `&end=${end}`;
        if (p.period) url += `&period=${p.period}`;
        if (p.fast)   url += `&fast=${p.fast}`;
        if (p.slow)   url += `&slow=${p.slow}`;
        if (p.signal) url += `&signal=${p.signal}`;
        if (p.mult)   url += `&mult=${p.mult}`;

        let data;
        try { const r = await fetch(url); if (!r.ok) continue; data = await r.json(); }
        catch (_) { continue; }

        for (const key of Object.keys(data).filter(k => !OSC_KEYS.has(k))) {
          const s = mainChart.addLineSeries({
            color: COLORS[key] ?? '#fff', lineWidth: 1,
            priceLineVisible: false, lastValueVisible: false,
          });
          s.setData(data[key]);
          overlaySeries.push(s);
        }

        for (const key of Object.keys(data).filter(k => OSC_KEYS.has(k))) {
          if (!oscChart) {
            document.getElementById('chart-osc').classList.add('on');
            oscChart = LightweightCharts.createChart(
              document.getElementById('chart-osc'), { ...THEME, autoSize: true }
            );
            mainChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
              if (r && oscChart) oscChart.timeScale().setVisibleLogicalRange(r);
            });
            oscChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
              if (r) mainChart.timeScale().setVisibleLogicalRange(r);
            });
          }
          const s = key === 'histogram'
            ? oscChart.addHistogramSeries({ color: COLORS[key], priceLineVisible: false, lastValueVisible: false })
            : oscChart.addLineSeries({ color: COLORS[key] ?? '#ccc', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
          s.setData(data[key]);
        }

        if (Object.keys(data).some(k => OSC_KEYS.has(k))) {
          const lbl = ind.type === 'macd'
            ? `MACD(${p.fast},${p.slow},${p.signal})`
            : `RSI(${p.period})`;
          oscLabels.push(lbl);
        }
      }

      if (oscChart) {
        document.getElementById('osc-lbl').textContent = oscLabels.join('  ');
        oscChart.timeScale().fitContent();
      }
    }

    function refreshIndicators() {
      const symbol = document.getElementById('symbol').value.trim().toUpperCase();
      const start  = document.getElementById('start').value;
      const end    = document.getElementById('end').value;
      const total  = allRegBars.length + allExtBars.length;
      if (total > 0 && symbol) {
        if (indicators.length > 0) fetchAllIndicators(symbol, start, end);
        else {
          overlaySeries.forEach(s => mainChart.removeSeries(s));
          overlaySeries = [];
          if (oscChart) { oscChart.remove(); oscChart = null; }
          document.getElementById('chart-osc').classList.remove('on');
        }
      }
    }

    // Enter key triggers load
    document.querySelectorAll('.controls input').forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') load(); })
    );

    load();
  </script>
</body>
</html>
