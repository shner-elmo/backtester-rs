<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>data-viz</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #131722; color: #d1d4dc; font-family: sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  #controls, #indicators {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 16px; background: #1e222d;
  }
  #indicators { padding-top: 0; gap: 6px; }
  input, select {
    background: #2a2e39; border: 1px solid #363a45; color: #d1d4dc;
    padding: 5px 8px; border-radius: 4px; font: inherit; font-size: 12px;
  }
  #symbol { width: 90px; text-transform: uppercase; }
  button { border: 1px solid #363a45; border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  #load { background: #2962ff; color: #fff; border-color: #2962ff; padding: 5px 16px; }
  #load:disabled { opacity: .55; cursor: default; }
  .ghost { background: #2a2e39; color: #b2b5be; }
  .ghost:hover { background: #363a45; }
  .tf.on { background: #2962ff; color: #fff; border-color: #2962ff; }
  .sep { width: 1px; height: 20px; background: #363a45; }
  #status { color: #787b86; font-size: 12px; }

  .chip { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 4px; background: #2a2e39; border: 1px solid #363a45; }
  .chip input { width: 46px; padding: 2px 4px; }
  .chip select { padding: 2px 4px; }
  .chip label { color: #787b86; font-size: 11px; }
  .chip .rm { background: none; border: none; color: #787b86; font-size: 15px; line-height: 1; padding: 0 2px; }
  .chip .rm:hover { color: #ef5350; }

  #panes { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
  /* min-height:0 lets the price pane shrink below its canvas's height when the osc pane
     appears — without it the default min-height:auto pins it to the full height and the
     osc pane overflows below the fold. */
  #price { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #osc { flex: 0 0 150px; min-height: 0; overflow: hidden; border-top: 1px solid #2a2e39; display: none; }
</style>
</head>
<body>

<div id="controls">
  <input id="symbol" type="text" value="AAPL" placeholder="Symbol">
  <div class="sep"></div>
  <span id="tfs"></span>
  <div class="sep"></div>
  <button class="ghost" onclick="shiftMonth('start', -1)">&#9664;</button>
  <input id="start" type="date" value="2021-01-01">
  <button class="ghost" onclick="shiftMonth('start', 1)">&#9654;</button>
  <span style="color:#787b86">&rarr;</span>
  <button class="ghost" onclick="shiftMonth('end', -1)">&#9664;</button>
  <input id="end" type="date" value="2021-02-01">
  <button class="ghost" onclick="shiftMonth('end', 1)">&#9654;</button>
  <div class="sep"></div>
  <button id="load" onclick="load()">Load</button>
  <span id="status"></span>
</div>

<div id="indicators">
  <button class="ghost" onclick="addChip()">+ Indicator</button>
</div>

<div id="panes">
  <div id="price"></div>
  <div id="osc"></div>
</div>

<script>
'use strict';

const LC = LightweightCharts;

// Bar times are US/Eastern wall-clock seconds (see OhlcBar::time), so Lightweight
// Charts' UTC rendering lands on market-local time with no formatter overrides.
const UP = '#26a69a', DOWN = '#ef5350';
const EXT_UP = 'rgba(38,166,154,.42)', EXT_DOWN = 'rgba(239,83,80,.42)';
const EXT_WICK = 'rgba(120,130,140,.5)';
const VOL_UP = 'rgba(38,166,154,.4)', VOL_DOWN = 'rgba(239,83,80,.4)';
const VOL_EXT = 'rgba(120,130,140,.28)';

const THEME = {
  layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
  grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
  crosshair: { mode: LC.CrosshairMode.Normal },
  // minBarSpacing defaults to 0.5px, which silently caps fitContent() at ~3k bars —
  // a month of minutes (~18k) would only ever show its last few days.
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39', minBarSpacing: 0.02 },
  rightPriceScale: { borderColor: '#2a2e39' },
};

// ── Charts and series: built once, never torn down ────────────────────────────

const priceEl = document.getElementById('price');
const oscEl = document.getElementById('osc');

const priceChart = LC.createChart(priceEl, { ...THEME, width: priceEl.clientWidth, height: priceEl.clientHeight });
const oscChart = LC.createChart(oscEl, { ...THEME, width: oscEl.clientWidth, height: 150 });

const candles = priceChart.addCandlestickSeries({
  upColor: UP, downColor: DOWN,
  borderUpColor: UP, borderDownColor: DOWN,
  wickUpColor: UP, wickDownColor: DOWN,
});
priceChart.priceScale('right').applyOptions({ scaleMargins: { top: 0.08, bottom: 0.22 } });

const volume = priceChart.addHistogramSeries({
  priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false,
});
priceChart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });

// Both panes plot the same bar array, so logical ranges keep them locked together
// regardless of gaps — a shared time range drifts once the series lengths differ.
// The sync stays off while the oscillator pane is empty: an empty chart clamps the
// range it is handed and echoes that back, which would undo fitContent().
let oscVisible = false;
let syncing = false;
const sync = to => range => {
  if (!oscVisible || syncing || !range) return;
  syncing = true;
  to.timeScale().setVisibleLogicalRange(range);
  syncing = false;
};
priceChart.timeScale().subscribeVisibleLogicalRangeChange(sync(oscChart));
oscChart.timeScale().subscribeVisibleLogicalRangeChange(sync(priceChart));

new ResizeObserver(() => {
  priceChart.applyOptions({ width: priceEl.clientWidth, height: priceEl.clientHeight });
  oscChart.applyOptions({ width: oscEl.clientWidth, height: oscEl.clientHeight || 150 });
}).observe(document.getElementById('panes'));

// Overlay/oscillator series are keyed by "spec/line" and reused across loads.
const extras = new Map();
function extraSeries(key, chart, factory) {
  let s = extras.get(key);
  if (!s) { s = { chart, series: factory() }; extras.set(key, s); }
  return s.series;
}
function dropUnusedExtras(live) {
  for (const [key, { chart, series }] of extras) {
    if (!live.has(key)) { chart.removeSeries(series); extras.delete(key); }
  }
}

// ── Toolbar ───────────────────────────────────────────────────────────────────

const TIMEFRAMES = [['min1', '1m'], ['min5', '5m'], ['daily', '1D'], ['weekly', '1W']];
let timeframe = 'min1';

for (const [key, label] of TIMEFRAMES) {
  const b = document.createElement('button');
  b.className = 'tf ghost' + (key === timeframe ? ' on' : '');
  b.textContent = label;
  b.dataset.tf = key;
  b.onclick = () => {
    timeframe = key;
    document.querySelectorAll('.tf').forEach(x => x.classList.toggle('on', x.dataset.tf === key));
  };
  document.getElementById('tfs').appendChild(b);
}

// Format a Date as YYYY-MM-DD in local time. `toISOString` renders in UTC, which
// rolls back a day in any timezone east of UTC and corrupted the month stepping.
function isoDate(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function shiftMonth(id, delta) {
  const el = document.getElementById(id);
  const d = new Date((el.value || '2021-01-01') + 'T00:00:00');
  d.setDate(1);
  d.setMonth(d.getMonth() + delta);
  el.value = isoDate(d);
}

for (const id of ['symbol', 'start', 'end']) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
}

const setStatus = msg => { document.getElementById('status').textContent = msg; };

// ── Indicator chips ───────────────────────────────────────────────────────────

const IND_PARAMS = {
  ema:    [['period', 'Period', 20]],
  sma:    [['period', 'Period', 20]],
  rsi:    [['period', 'Period', 14]],
  macd:   [['fast', 'Fast', 12], ['slow', 'Slow', 26], ['signal', 'Sig', 9]],
  bbands: [['period', 'Period', 20], ['mult', 'σ', 2]],
};
// line name → which pane it belongs to, and how strongly it is tinted. The hue comes
// from the chip's slot in PALETTE, so `ema:20` and `ema:50` never share a colour.
const LINES = {
  ema:       { pane: 'price', alpha: 1 },
  sma:       { pane: 'price', alpha: 1 },
  middle:    { pane: 'price', alpha: 1 },
  upper:     { pane: 'price', alpha: 0.55 },
  lower:     { pane: 'price', alpha: 0.55 },
  rsi:       { pane: 'osc', alpha: 1 },
  macd:      { pane: 'osc', alpha: 1 },
  signal:    { pane: 'osc', alpha: 0.6 },
  histogram: { pane: 'osc', alpha: 0.35, histogram: true },
};
const PALETTE = ['#f0a500', '#61afef', '#c678dd', '#98c379', '#e06c75', '#56b6c2'];

function tint(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${alpha})`;
}

let chips = [];

const specOf = chip => [chip.type, ...IND_PARAMS[chip.type].map(([name]) => chip[name])].join(':');

function addChip() {
  chips.push({ type: 'ema', period: 20 });
  renderChips();
}

function renderChips() {
  const row = document.getElementById('indicators');
  row.querySelectorAll('.chip').forEach(c => c.remove());

  for (const chip of chips) {
    const el = document.createElement('div');
    el.className = 'chip';

    const type = document.createElement('select');
    for (const t of Object.keys(IND_PARAMS)) {
      type.add(new Option(t.toUpperCase(), t, false, t === chip.type));
    }
    type.onchange = () => {
      chip.type = type.value;
      for (const [name, , def] of IND_PARAMS[chip.type]) chip[name] = def;
      renderChips();
    };
    el.appendChild(type);

    for (const [name, label, def] of IND_PARAMS[chip.type]) {
      if (chip[name] === undefined) chip[name] = def;
      const lbl = document.createElement('label');
      lbl.textContent = label;
      el.appendChild(lbl);

      const input = document.createElement('input');
      input.type = 'number';
      input.min = 1;
      input.step = name === 'mult' ? 0.1 : 1;
      input.value = chip[name];
      input.onchange = () => { chip[name] = parseFloat(input.value) || def; };
      el.appendChild(input);
    }

    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.onclick = () => { chips = chips.filter(c => c !== chip); renderChips(); };
    el.appendChild(rm);

    row.appendChild(el);
  }
}

// ── Load ──────────────────────────────────────────────────────────────────────

let inFlight = null;

async function load() {
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  if (!symbol) { setStatus('Enter a symbol'); return; }

  // A newer request supersedes the older one; no request bookkeeping beyond this.
  if (inFlight) inFlight.abort();
  const ctl = new AbortController();
  inFlight = ctl;

  const q = new URLSearchParams({
    symbol,
    tf: timeframe,
    start: document.getElementById('start').value,
    end: document.getElementById('end').value,
  });
  const specs = chips.map(specOf);
  if (specs.length) q.set('ind', specs.join(','));

  document.getElementById('load').disabled = true;
  setStatus('Loading…');

  let payload;
  try {
    const res = await fetch('/api/bars?' + q, { signal: ctl.signal });
    payload = await res.json();
    if (!res.ok) throw new Error(payload.error || res.statusText);
  } catch (e) {
    if (e.name === 'AbortError') return;
    setStatus('Error: ' + e.message);
    document.getElementById('load').disabled = false;
    return;
  }
  if (inFlight !== ctl) return;
  inFlight = null;
  document.getElementById('load').disabled = false;

  draw(payload);
}

function draw({ bars, indicators }) {
  // One pass per series, one setData each — the whole point of dropping streaming.
  candles.setData(bars.map(b => b.is_extended ? {
    time: b.time, open: b.open, high: b.high, low: b.low, close: b.close,
    color: b.close >= b.open ? EXT_UP : EXT_DOWN,
    borderColor: b.close >= b.open ? EXT_UP : EXT_DOWN,
    wickColor: EXT_WICK,
  } : {
    time: b.time, open: b.open, high: b.high, low: b.low, close: b.close,
  }));

  volume.setData(bars.map(b => ({
    time: b.time,
    value: b.volume,
    color: b.is_extended ? VOL_EXT : (b.close >= b.open ? VOL_UP : VOL_DOWN),
  })));

  const live = new Set();

  const order = chips.map(specOf);

  // Each oscillator indicator (RSI, MACD, …) gets its own price scale so they never
  // share a y-axis — RSI's 0–100 range would otherwise flatten MACD to a line at zero.
  // The osc pane is then split into equal horizontal bands, one per indicator, so they
  // stack vertically instead of overlapping.
  const oscSpecs = order.filter(spec => {
    const lines = indicators[spec];
    return lines && Object.keys(lines).some(name => LINES[name] && LINES[name].pane === 'osc');
  });
  const needsOsc = oscSpecs.length > 0;

  for (const [spec, lines] of Object.entries(indicators)) {
    const hue = PALETTE[Math.max(order.indexOf(spec), 0) % PALETTE.length];
    const oscScaleId = 'osc/' + spec;
    for (const [name, values] of Object.entries(lines)) {
      const style = LINES[name];
      if (!style) continue;
      const color = tint(hue, style.alpha);
      const key = spec + '/' + name;
      live.add(key);

      const chart = style.pane === 'osc' ? oscChart : priceChart;
      const scaleId = style.pane === 'osc' ? oscScaleId : 'right';
      const series = extraSeries(key, chart, () =>
        style.histogram
          ? chart.addHistogramSeries({ priceScaleId: scaleId, color, priceLineVisible: false })
          : chart.addLineSeries({ priceScaleId: scaleId, color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false }));
      series.applyOptions({ color });
      series.setData(values.map((value, i) => {
        const point = { time: bars[i].time, value };
        // MACD histogram: green above zero, red below — same convention as the candles.
        if (style.histogram && value != null) point.color = value >= 0 ? UP : DOWN;
        return point;
      }));
    }
  }
  dropUnusedExtras(live);

  // Assign each oscillator its horizontal band within the osc pane.
  const n = oscSpecs.length;
  oscSpecs.forEach((spec, i) => {
    oscChart.priceScale('osc/' + spec).applyOptions({
      scaleMargins: { top: i / n + 0.04, bottom: (n - 1 - i) / n + 0.04 },
    });
  });

  oscVisible = false;   // keep the panes unlinked until both hold the same bars
  oscEl.style.display = needsOsc ? 'block' : 'none';
  // Toggling the osc pane re-splits #panes but leaves its size unchanged, so the
  // ResizeObserver never fires. Resize both charts to their new heights explicitly —
  // otherwise the price canvas keeps its old full height and shoves the osc pane
  // (and its RSI/MACD lines) off the bottom of the viewport.
  priceChart.applyOptions({ width: priceEl.clientWidth, height: priceEl.clientHeight });
  oscChart.applyOptions({ width: oscEl.clientWidth, height: oscEl.clientHeight || 150 });

  priceChart.timeScale().fitContent();
  if (needsOsc) {
    oscChart.timeScale().fitContent();
    oscVisible = true;
  }
  setStatus(bars.length ? bars.length.toLocaleString() + ' bars' : 'No data for this range');
}

renderChips();
load();
</script>
</body>
</html>
