name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Supersede in-flight runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # `scripts/` lives outside the Cargo workspace — deliberately, so its
  # dependencies (arrow/parquet for the ingest, an HTTPS stack for the SEC
  # downloader) never reach anyone building the engine. The cost is that
  # `cargo test --workspace` above cannot see these files at all, so without
  # this job they rot silently.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # rust-script compiles each script into its own cache dir, which the
      # cargo cache above doesn't cover. Keyed on the scripts themselves: an
      # edit to either one rebuilds, anything else restores.
      - name: Cache rust-script builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ runner.os }}-${{ hashFiles('scripts/*.rs') }}
          restore-keys: rust-script-${{ runner.os }}-
      - name: Install rust-script
        run: cargo install rust-script --locked
      - name: Format
        run: rustfmt --check --edition 2021 scripts/*.rs
      # --test compiles the script and runs whatever tests it has:
      # insider_fetch has 6, ingest_arrow has none, so that one is a
      # compile-and-link check.
      - name: Test scripts/insider_fetch.rs
        run: rust-script --test scripts/insider_fetch.rs
      - name: Check scripts/ingest_arrow.rs
        run: rust-script --test scripts/ingest_arrow.rs

  bench:
    runs-on: ubuntu-latest
    # Read-only: no token, no branch pushes, no third-party actions. Regressions
    # are caught by comparing against a baseline committed in the repo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs on the replicated fixture (real data isn't available in CI).
      # `bencher` output is ns/iter, lower is better.
      - name: Run benchmarks
        # Start criterion from a clean slate. The build cache can restore a
        # partial target/criterion/.../base baseline (its key shifts whenever
        # Cargo.lock changes), and criterion then prints an error *mid-line*
        # into the bencher output, splitting the "test ... bench:" line so the
        # comparison step parses nothing. A fresh run emits clean single lines.
        run: |
          rm -rf target/criterion
          cargo bench -p backtester --bench engine -- --output-format bencher | tee bench-output.txt
      # Fail if any benchmark is >2x slower than the committed baseline. Missing
      # baseline just prints the numbers (exit 0) so a first run can seed it.
      # Refresh the baseline by re-running the bench and committing the new
      # backtester/benches/baseline.bencher.txt.
      - name: Compare against baseline
        run: python3 scripts/bench_compare.py backtester/benches/baseline.bencher.txt bench-output.txt
