name: CI

on:
  push:
    # master is the long-term source of the benchmark baseline. The feature
    # branch is included temporarily so the gh-pages history file starts
    # accumulating before the first merge — drop it once master has run once.
    branches: [master, claude/repo-improvements-f6znzr]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  bench:
    runs-on: ubuntu-latest
    # Push a new baseline to the gh-pages branch (contents) and comment on a PR
    # when it regresses (pull-requests).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs on a synthetic dataset since the real data isn't available in CI.
      # `bencher` output (ns/iter, lower is better) is what the tracker parses.
      - name: Run benchmarks
        run: cargo bench -p backtester --bench engine -- --output-format bencher | tee bench-output.txt
      - name: Track benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Backtester throughput
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Alert (and fail) when a run is more than 2x slower than the stored
          # baseline. 2x is deliberately loose to ride out GitHub runner
          # variance; tighten once the baseline proves stable.
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          # Push events (master, or the bootstrap branch above) append to the
          # gh-pages history file; PRs compare against it without writing, so
          # they can't clobber the baseline or need push access from a fork.
          auto-push: ${{ github.event_name == 'push' }}
          save-data-file: ${{ github.event_name == 'push' }}
