[package]
name = "backtester"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = "56"
arrow = { version = "56", features = ["chrono-tz"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
ta = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rustc-hash = "2"

[[example]]
name = "ema_cross"
path = "examples/ema_cross.rs"

[[bench]]
name = "engine"
harness = false

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
